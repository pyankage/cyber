<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnimeStream - Detail</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="../style.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;500;600;700&display=swap');

        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121f;
            --bg-card: rgba(18, 18, 31, 0.6);
            --neon-purple: #a855f7;
            --neon-pink: #ec4899;
            --text-primary: #f1f3f5;
            --text-secondary: #8892b0;
            --glow-purple: 0 0 30px rgba(168, 85, 247, 0.15);
            --border-neon: 1px solid rgba(168, 85, 247, 0.2);
        }

        * { margin:0; padding:0; box-sizing:border-box; }

        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
        }

        header {
            background: rgba(10, 10, 15, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: var(--border-neon);
            padding: 12px 30px;
            position: sticky;
            top: 0;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        .logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 20px;
            font-weight: 900;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .logo .neon { color: var(--neon-purple); text-shadow: 0 0 20px rgba(168, 85, 247, 0.4); }
        .cyber-badge {
            font-family: 'Orbitron', sans-serif;
            font-size: 8px;
            font-weight: 700;
            color: var(--neon-pink);
            background: rgba(236, 72, 153, 0.15);
            border: 1px solid rgba(236, 72, 153, 0.3);
            padding: 2px 8px;
            border-radius: 4px;
            letter-spacing: 1px;
        }
        .nav-links {
            display: flex;
            gap: 20px;
            align-items: center;
        }
        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            transition: 0.3s;
        }
        .nav-links a:hover { color: var(--neon-purple); }

        .breadcrumb {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 15px 0 10px 0;
            font-size: 13px;
            color: var(--text-secondary);
        }
        .breadcrumb a {
            color: var(--text-secondary);
            text-decoration: none;
            cursor: pointer;
            transition: 0.3s;
        }
        .breadcrumb a:hover { color: var(--neon-purple); }
        .breadcrumb i { font-size: 10px; color: rgba(255,255,255,0.1); }
        .breadcrumb span { color: var(--text-primary); font-weight: 600; }

        .container { max-width: 1100px; margin: 0 auto; padding: 20px 30px 30px; }

        .detail-banner {
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: var(--border-neon);
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 30px;
            display: flex;
            flex-wrap: wrap;
        }
        .detail-banner .poster {
            flex: 0 0 220px;
            height: 320px;
        }
        .detail-banner .poster img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .detail-banner .desc {
            flex: 1;
            padding: 25px 30px;
        }
        .detail-banner .desc h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .detail-banner .desc .status {
            display: inline-block;
            background: linear-gradient(135deg, var(--neon-purple), var(--neon-pink));
            color: #fff;
            padding: 2px 14px;
            border-radius: 50px;
            font-size: 11px;
            font-weight: 600;
            margin-bottom: 10px;
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 1px;
        }
        .detail-banner .desc .genres {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 10px 0;
        }
        .detail-banner .desc .genres span {
            background: rgba(255,255,255,0.05);
            border: var(--border-neon);
            padding: 4px 14px;
            border-radius: 50px;
            font-size: 11px;
            color: var(--text-secondary);
        }
        .detail-banner .desc .genres span:hover {
            border-color: var(--neon-purple);
            color: var(--text-primary);
        }
        .detail-banner .desc p {
            color: var(--text-secondary);
            line-height: 1.7;
            font-size: 14px;
        }
        .detail-banner .desc .meta-info {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 15px;
            font-size: 13px;
            color: var(--text-secondary);
        }
        .detail-banner .desc .meta-info i { color: var(--neon-purple); margin-right: 5px; }

        .episode-section { margin-top: 30px; }
        .episode-section h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 15px;
        }
        .episode-section h2 i { color: var(--neon-pink); margin-right: 10px; }

        .episode-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 12px;
        }
        .episode-btn {
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            border: var(--border-neon);
            border-radius: 12px;
            padding: 14px 10px;
            text-align: center;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-primary);
            cursor: pointer;
            transition: 0.3s;
        }
        .episode-btn:hover {
            background: linear-gradient(135deg, var(--neon-purple), var(--neon-pink));
            border-color: transparent;
            box-shadow: 0 0 30px rgba(168, 85, 247, 0.2);
            transform: translateY(-3px);
        }
        .episode-btn .ep-num {
            display: block;
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            font-weight: 700;
            color: var(--neon-purple);
        }
        .episode-btn:hover .ep-num { color: #fff; }
        .episode-btn .ep-title {
            display: block;
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 4px;
        }
        .episode-btn:hover .ep-title { color: rgba(255,255,255,0.8); }

        .footer {
            margin-top: 40px;
            padding-top: 18px;
            border-top: var(--border-neon);
            text-align: center;
            font-size: 13px;
            color: var(--text-secondary);
        }
        .footer .neon { color: var(--neon-pink); }

        @media (max-width: 768px) {
            header { padding: 10px 15px; flex-direction: column; align-items: stretch; gap: 10px; }
            .nav-links { justify-content: center; flex-wrap: wrap; gap: 12px; }
            .container { padding: 10px 15px; }
            .detail-banner .poster { flex: 0 0 100%; height: 220px; }
            .detail-banner .desc { padding: 15px; }
            .detail-banner .desc h1 { font-size: 20px; }
            .episode-list { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <span class="neon">A</span>nime<span class="neon">S</span>tream
            <span class="cyber-badge">✦ DETAIL</span>
        </div>
        <div class="nav-links">
            <a href="../index.html"><i class="fas fa-home"></i> Home</a>
            <a href="#"><i class="fas fa-fire"></i> Trending</a>
            <a href="#"><i class="fas fa-tags"></i> Genre</a>
        </div>
    </header>

    <div class="container">

        <div class="breadcrumb">
            <a href="#" onclick="location.href='../index.html'">Home</a>
            <i class="fas fa-chevron-right"></i>
            <span id="breadcrumbTitle">Loading...</span>
        </div>

        <div id="detailContent">
            <div class="loader"><i class="fas fa-spinner"></i></div>
        </div>

        <div class="footer">
            &copy; 2026 AnimeStream — Made with <i class="fas fa-heart neon"></i>
        </div>

    </div>

    <script>
        // ============================================================
        //  ★ LOAD DETAIL DARI LOCALSTORAGE ★
        // ============================================================
        function loadDetail() {
            const container = document.getElementById('detailContent');
            const breadcrumbTitle = document.getElementById('breadcrumbTitle');

            console.log('🔍 Loading detail...');

            // Ambil data dari localStorage
            const animeData = localStorage.getItem('currentAnime');
            const episodesData = localStorage.getItem('currentEpisodes');

            console.log('📦 Anime data:', animeData);
            console.log('📦 Episodes data:', episodesData);

            if (!animeData) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-exclamation-triangle"></i>
                        <p>Data anime tidak ditemukan.</p>
                        <p style="font-size:12px; margin-top:8px; color:#8892b0;">
                            Silakan kembali ke Home dan klik kartu anime.
                        </p>
                        <button onclick="location.href='../index.html'" style="margin-top:15px;padding:10px 25px;background:var(--neon-purple);border:none;border-radius:50px;color:#fff;cursor:pointer;">
                            Kembali ke Home
                        </button>
                    </div>
                `;
                return;
            }

            const anime = JSON.parse(animeData);
            const episodes = episodesData ? JSON.parse(episodesData) : [];

            console.log('📺 Anime:', anime.title);
            console.log('📺 Episodes:', episodes.length);

            // Update breadcrumb
            breadcrumbTitle.textContent = anime.title;

            // ★ RENDER GENRE - PAKAI REPLACE (SAMA KAYAK HOME) ★
            const genres = anime.genre ? anime.genre.replace(/,\s*/g, ', ') : '';

            // Render episode buttons
            let episodeButtons = '';
            if (episodes.length > 0) {
                episodeButtons = episodes.map(ep => `
                    <div class="episode-btn" onclick="location.href='../watch.html?anime=${anime.id}&ep=${ep.number}&url=${ep.url}'">
                        <span class="ep-num">EP ${ep.number}</span>
                        <span class="ep-title">${ep.title || anime.title + ' Episode ' + ep.number}</span>
                    </div>
                `).join('');
            } else {
                episodeButtons = `<div class="empty-state"><p>Belum ada episode.</p></div>`;
            }

            container.innerHTML = `
                <div class="detail-banner">
                    <div class="poster">
                        <img src="${anime.image || 'https://via.placeholder.com/300x400/141425/7a7a9a?text=No+Image'}" 
                             alt="${anime.title}" 
                             onerror="this.src='https://via.placeholder.com/300x400/141425/7a7a9a?text=No+Image'">
                    </div>
                    <div class="desc">
                        <h1>${anime.title}</h1>
                        <span class="status">Ongoing</span>
                        <div class="genres">${genres}</div>
                        <p>${anime.synopsis || 'Tidak ada sinopsis.'}</p>
                        <div class="meta-info">
                            <span><i class="fas fa-calendar-alt"></i> Updated: ${anime.date || new Date().toLocaleDateString('id-ID')}</span>
                            <span><i class="fas fa-list-ul"></i> Total Episode: ${episodes.length}</span>
                        </div>
                    </div>
                </div>
                <div class="episode-section">
                    <h2><i class="fas fa-list-ul"></i> Daftar Episode</h2>
                    <div class="episode-list">${episodeButtons}</div>
                </div>
            `;
        }

        // ============================================================
        //  ★ INISIALISASI ★
        // ============================================================
        document.addEventListener('DOMContentLoaded', loadDetail);

        console.log('📊 Detail page loaded.');
        console.log('💡 Data dari localStorage.');
    </script>

</body>
</html>
