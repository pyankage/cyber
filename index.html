<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tombol Sudut Terpotong</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* --- Reset dasar & tema --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0f;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            padding: 20px;
            gap: 30px;
        }

        /* --- Gaya tombol "clipped corner" --- */
        .btn-clipped {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;

            /* Warna dasar */
            background: linear-gradient(135deg, #a855f7, #ec4899);
            color: #fff;
            border: none;
            padding: 12px 28px;

            /* Ukuran font & tebal */
            font-size: 14px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;

            /* Clipped corner utama pakai clip-path */
            clip-path: polygon(
                12px 0%,            /* kiri atas miring */
                100% 0%,            /* kanan atas */
                100% calc(100% - 12px), /* kanan bawah miring */
                calc(100% - 12px) 100%, /* bawah kanan miring */
                0% 100%,            /* kiri bawah */
                0% 12px             /* kiri atas miring (kembali) */
            );

            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 4px 15px rgba(168, 85, 247, 0.25);
            text-decoration: none;
            letter-spacing: 0.3px;
            min-width: 120px;
        }

        /* Hover efek */
        .btn-clipped:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 8px 30px rgba(168, 85, 247, 0.45);
            filter: brightness(1.08);
        }

        /* Tombol dengan border (outline) */
        .btn-clipped-outline {
            background: transparent;
            color: #f1f3f5;
            border: 2px solid rgba(168, 85, 247, 0.5);
            box-shadow: none;
            clip-path: polygon(
                12px 0%,
                100% 0%,
                100% calc(100% - 12px),
                calc(100% - 12px) 100%,
                0% 100%,
                0% 12px
            );
        }

        .btn-clipped-outline:hover {
            background: rgba(168, 85, 247, 0.12);
            border-color: #a855f7;
            box-shadow: 0 0 30px rgba(168, 85, 247, 0.15);
            transform: translateY(-2px);
        }

        /* Tombol ukuran kecil */
        .btn-clipped-sm {
            padding: 6px 16px;
            font-size: 12px;
            min-width: 80px;
            clip-path: polygon(
                8px 0%,
                100% 0%,
                100% calc(100% - 8px),
                calc(100% - 8px) 100%,
                0% 100%,
                0% 8px
            );
        }

        /* Tombol ukuran besar */
        .btn-clipped-lg {
            padding: 16px 40px;
            font-size: 18px;
            min-width: 180px;
            clip-path: polygon(
                16px 0%,
                100% 0%,
                100% calc(100% - 16px),
                calc(100% - 16px) 100%,
                0% 100%,
                0% 16px
            );
        }

        /* ----- VARIAN: kotak dengan clipped corner di semua sisi (lebih ekstrim) ----- */
        .btn-clipped-box {
            clip-path: polygon(
                12px 0%,
                calc(100% - 12px) 0%,
                100% 12px,
                100% calc(100% - 12px),
                calc(100% - 12px) 100%,
                12px 100%,
                0% calc(100% - 12px),
                0% 12px
            );
            background: #1e1b2e;
            border: 2px solid #a855f7;
            color: #fff;
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.15);
        }

        .btn-clipped-box:hover {
            background: #2a2440;
            border-color: #ec4899;
            box-shadow: 0 0 40px rgba(236, 72, 153, 0.2);
        }

        /* --- Container demo --- */
        .demo-section {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 20px;
            background: rgba(255, 255, 255, 0.02);
            padding: 30px 40px;
            border-radius: 24px;
            border: 1px solid rgba(168, 85, 247, 0.12);
            max-width: 900px;
            width: 100%;
        }

        .demo-label {
            color: #8892b0;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            width: 100%;
            text-align: center;
            margin-bottom: 6px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            padding-bottom: 8px;
        }

        /* --- Responsive --- */
        @media (max-width: 600px) {
            .demo-section {
                padding: 20px 16px;
                gap: 14px;
            }
            .btn-clipped-lg {
                padding: 14px 28px;
                font-size: 16px;
                min-width: 140px;
            }
        }
    </style>
</head>
<body>

    <!-- === DEMO 1: TOMBOL CLIPPED CORNER (UKURAN VARIATIF) === -->
    <div class="demo-section">
        <div class="demo-label">✦ Clipped Corner — varian ukuran</div>

        <!-- Kecil -->
        <button class="btn-clipped btn-clipped-sm">
            <i class="fas fa-play"></i> Kecil
        </button>

        <!-- Sedang (default) -->
        <button class="btn-clipped">
            <i class="fas fa-play"></i> Sedang
        </button>

        <!-- Besar -->
        <button class="btn-clipped btn-clipped-lg">
            <i class="fas fa-play"></i> Besar
        </button>

        <!-- Outline -->
        <button class="btn-clipped btn-clipped-outline">
            <i class="fas fa-list"></i> Outline
        </button>

        <!-- Box (clipped di semua sudut) -->
        <button class="btn-clipped btn-clipped-box">
            <i class="fas fa-cube"></i> Box
        </button>
    </div>

    <!-- === DEMO 2: TOMBOL CLIPPED CORNER UNTUK KOTAK / ELEMEN BESAR === -->
    <div class="demo-section" style="flex-direction: column; align-items: stretch; gap: 18px;">
        <div class="demo-label">✦ Elemen besar dengan sudut terpotong</div>

        <div style="display: flex; flex-wrap: wrap; gap: 14px; justify-content: center;">
            <!-- Tombol besar dengan icon -->
            <button class="btn-clipped btn-clipped-lg" style="min-width: 200px;">
                <i class="fas fa-dragon"></i> Mulai Nonton
            </button>

            <!-- Tombol besar outline -->
            <button class="btn-clipped btn-clipped-lg btn-clipped-outline" style="min-width: 200px;">
                <i class="fas fa-fire"></i> Trending
            </button>
        </div>

        <!-- Sebuah "card" / kotak besar dengan sudut terpotong (bukan tombol, tapi elemen) -->
        <div style="
            clip-path: polygon(
                16px 0%,
                calc(100% - 16px) 0%,
                100% 16px,
                100% calc(100% - 16px),
                calc(100% - 16px) 100%,
                16px 100%,
                0% calc(100% - 16px),
                0% 16px
            );
            background: rgba(168, 85, 247, 0.06);
            border: 1.5px solid rgba(168, 85, 247, 0.2);
            padding: 24px 28px;
            color: #f1f3f5;
            text-align: center;
            backdrop-filter: blur(6px);
            transition: 0.3s;
        ">
            <p style="font-size: 16px; font-weight: 500;">
                <i class="fas fa-tv" style="color: #a855f7; margin-right: 10px;"></i>
                Ini adalah <strong style="color: #a855f7;">kotak besar</strong> dengan sudut terpotong
            </p>
            <p style="color: #8892b0; font-size: 14px; margin-top: 6px;">
                Bisa dipakai untuk card, banner, atau panel apapun.
            </p>
        </div>
    </div>

    <!-- === DEMO 3: SEMUA TOMBOL DI ATAS BISA DIKLIK === -->
    <div style="color: #8892b0; font-size: 12px; text-align: center; max-width: 500px; border-top: 1px solid rgba(255,255,255,0.04); padding-top: 18px;">
        <i class="fas fa-chevron-circle-right" style="color: #a855f7;"></i>
        Semua tombol di atas menggunakan <code style="background: rgba(255,255,255,0.04); padding: 2px 8px; border-radius: 4px;">clip-path</code> untuk sudut terpotong.
        Ukuran <strong>kecil</strong>, <strong>sedang</strong>, <strong>besar</strong>, <strong>outline</strong>, dan <strong>box</strong>.
    </div>

</body>
</html>
