<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnimeStream - Cyberpunk</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;500;600;700&display=swap');

        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121f;
            --bg-card: rgba(18, 18, 31, 0.6);
            --neon-purple: #a855f7;
            --neon-pink: #ec4899;
            --text-primary: #f1f3f5;
            --text-secondary: #8892b0;
            --glow-purple: 0 0 30px rgba(168, 85, 247, 0.15);
            --border-neon: 1px solid rgba(168, 85, 247, 0.2);
        }

        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:var(--bg-primary); color:var(--text-primary); font-family:'Inter',sans-serif; min-height:100vh; overflow-x:hidden; }

        ::-webkit-scrollbar { width:6px; }
        ::-webkit-scrollbar-track { background:var(--bg-secondary); }
        ::-webkit-scrollbar-thumb { background:var(--neon-purple); border-radius:10px; }
        ::-webkit-scrollbar-thumb:hover { background:var(--neon-pink); }

        /* ============================================================
           TOMBOL CLIPPED CORNER — KIRI ATAS + KANAN BAWAH
           ============================================================ */
        .btn-clipped {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: linear-gradient(135deg, var(--neon-purple), var(--neon-pink));
            color: #fff;
            border: none;
            padding: 12px 28px;
            font-size: 14px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.25s ease;
            text-decoration: none;
            letter-spacing: 0.3px;
            /* ★ CLIPPED CORNER: kiri atas + kanan bawah saja ★ */
            clip-path: polygon(
                12px 0%,
                100% 0%,
                100% 0%,
                100% calc(100% - 12px),
                calc(100% - 12px) 100%,
                0% 100%,
                0% 100%,
                0% 12px
            );
        }

        .btn-clipped:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 8px 30px rgba(168, 85, 247, 0.45);
            filter: brightness(1.08);
        }

        /* --- VARIAN OUTLINE --- */
        .btn-clipped-outline {
            background: transparent;
            color: var(--text-primary);
            border: var(--border-neon);
            box-shadow: none;
            clip-path: polygon(
                12px 0%,
                100% 0%,
                100% 0%,
                100% calc(100% - 12px),
                calc(100% - 12px) 100%,
                0% 100%,
                0% 100%,
                0% 12px
            );
        }

        .btn-clipped-outline:hover {
            background: rgba(168, 85, 247, 0.08);
            border-color: var(--neon-purple);
            box-shadow: var(--glow-purple);
            transform: translateY(-2px);
        }

        /* --- UKURAN KECIL (untuk genre btn) --- */
        .btn-clipped-sm {
            padding: 6px 16px;
            font-size: 12px;
            font-weight: 500;
            clip-path: polygon(
                8px 0%,
                100% 0%,
                100% 0%,
                100% calc(100% - 8px),
                calc(100% - 8px) 100%,
                0% 100%,
                0% 100%,
                0% 8px
            );
            gap: 6px;
        }

        /* --- UKURAN BESAR (untuk hero) --- */
        .btn-clipped-lg {
            padding: 16px 40px;
            font-size: 18px;
            clip-path: polygon(
                16px 0%,
                100% 0%,
                100% 0%,
                100% calc(100% - 16px),
                calc(100% - 16px) 100%,
                0% 100%,
                0% 100%,
                0% 16px
            );
        }

        /* ============================================================
           STYLE ASLI ANIMESTREAM (DIUBAH JADI CLIPPED)
           ============================================================ */

        /* HEADER */
        header {
            background:rgba(10,10,15,0.8);
            backdrop-filter:blur(20px);
            -webkit-backdrop-filter:blur(20px);
            border-bottom:var(--border-neon);
            padding:12px 30px;
            position:sticky;
            top:0;
            z-index:1000;
        }
        .header-top { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:15px; }
        .logo {
            font-family:'Orbitron',sans-serif;
            font-size:22px;
            font-weight:900;
            color:var(--text-primary);
            display:flex;
            align-items:center;
            gap:8px;
        }
        .logo .neon { color:var(--neon-purple); text-shadow:0 0 20px rgba(168,85,247,0.4); }
        .cyber-badge {
            font-family:'Orbitron',sans-serif;
            font-size:8px;
            font-weight:700;
            color:var(--neon-pink);
            background:rgba(236,72,153,0.15);
            border:1px solid rgba(236,72,153,0.3);
            padding:2px 8px;
            border-radius:4px;
            letter-spacing:1px;
        }
        .search-box {
            display:flex;
            align-items:center;
            background:rgba(255,255,255,0.05);
            border:var(--border-neon);
            padding:6px 6px 6px 18px;
            transition:0.3s;
            /* search box juga pakai clipped */
            clip-path: polygon(
                8px 0%,
                100% 0%,
                100% 0%,
                100% calc(100% - 8px),
                calc(100% - 8px) 100%,
                0% 100%,
                0% 100%,
                0% 8px
            );
        }
        .search-box:focus-within { border-color:var(--neon-purple); box-shadow:var(--glow-purple); }
        .search-box input {
            background:transparent;
            border:none;
            outline:none;
            color:var(--text-primary);
            padding:8px 12px;
            width:200px;
            font-size:13px;
        }
        .search-box input::placeholder { color:var(--text-secondary); }
        .search-box button {
            background:linear-gradient(135deg,var(--neon-purple),var(--neon-pink));
            border:none;
            color:#fff;
            padding:10px 16px;
            cursor:pointer;
            font-size:14px;
            transition:0.3s;
            /* tombol search clipped */
            clip-path: polygon(
                6px 0%,
                100% 0%,
                100% 0%,
                100% calc(100% - 6px),
                calc(100% - 6px) 100%,
                0% 100%,
                0% 100%,
                0% 6px
            );
        }
        .search-box button:hover { transform:scale(1.05); box-shadow:0 0 30px rgba(168,85,247,0.3); }

        .main-nav {
            display:flex;
            flex-wrap:wrap;
            gap:25px;
            padding:8px 0 4px 0;
            border-top:1px solid rgba(255,255,255,0.03);
        }
        .main-nav a {
            color:var(--text-secondary);
            text-decoration:none;
            font-size:13px;
            font-weight:500;
            padding:6px 0;
            transition:0.3s;
            display:flex;
            align-items:center;
            gap:6px;
            position:relative;
        }
        .main-nav a i { font-size:12px; }
        .main-nav a::after {
            content:'';
            position:absolute;
            bottom:0;
            left:0;
            width:0;
            height:2px;
            background:linear-gradient(90deg,var(--neon-purple),var(--neon-pink));
            transition:0.3s;
        }
        .main-nav a:hover { color:var(--text-primary); }
        .main-nav a:hover::after { width:100%; }
        .main-nav a.active { color:var(--neon-purple); }
        .main-nav a.active::after { width:100%; }

        /* HERO */
        .hero-banner {
            position:relative;
            padding:60px 30px 50px;
            margin:0 30px;
            background:linear-gradient(135deg,rgba(168,85,247,0.08),rgba(236,72,153,0.05));
            border:var(--border-neon);
            overflow:hidden;
            margin-top:20px;
            /* hero banner clipped */
            clip-path: polygon(
                16px 0%,
                100% 0%,
                100% 0%,
                100% calc(100% - 16px),
                calc(100% - 16px) 100%,
                0% 100%,
                0% 100%,
                0% 16px
            );
        }
        .hero-banner::before {
            content:'';
            position:absolute;
            top:-50%;
            right:-20%;
            width:60%;
            height:200%;
            background:radial-gradient(ellipse,rgba(168,85,247,0.1) 0%,transparent 70%);
            pointer-events:none;
        }
        .hero-content { position:relative; z-index:1; max-width:600px; }
        .hero-tag {
            font-family:'Orbitron',sans-serif;
            font-size:11px;
            font-weight:700;
            color:var(--neon-pink);
            letter-spacing:3px;
            text-transform:uppercase;
            margin-bottom:12px;
        }
        .hero-title {
            font-family:'Orbitron',sans-serif;
            font-size:48px;
            font-weight:900;
            line-height:1.1;
            margin-bottom:16px;
        }
        .hero-title .neon { color:var(--neon-purple); text-shadow:0 0 40px rgba(168,85,247,0.3); }
        .hero-desc {
            color:var(--text-secondary);
            font-size:16px;
            line-height:1.7;
            margin-bottom:24px;
            max-width:480px;
        }
        .hero-buttons { display:flex; gap:14px; flex-wrap:wrap; }
        .hero-glow {
            position:absolute;
            top:-100px;
            right:-100px;
            width:400px;
            height:400px;
            background:radial-gradient(ellipse,rgba(168,85,247,0.15),transparent 70%);
            pointer-events:none;
            animation:pulseGlow 4s ease-in-out infinite;
        }
        @keyframes pulseGlow { 0%,100% { transform:scale(1); opacity:0.5; } 50% { transform:scale(1.2); opacity:1; } }

        /* KONTEN */
        .container { max-width:1400px; margin:0 auto; padding:20px 30px 30px; }
        .page { display:none; }
        .page.active { display:block; }

        .section-header {
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin:30px 0 15px 0;
        }
        .section-title {
            font-family:'Orbitron',sans-serif;
            font-size:20px;
            font-weight:700;
            color:var(--text-primary);
            display:flex;
            align-items:center;
            gap:12px;
        }
        .section-title i { color:var(--neon-pink); }
        .section-badge {
            font-family:'Orbitron',sans-serif;
            font-size:9px;
            font-weight:700;
            color:var(--neon-pink);
            background:rgba(236,72,153,0.15);
            border:1px solid rgba(236,72,153,0.2);
            padding:2px 10px;
            border-radius:4px;
            letter-spacing:1px;
        }
        .section-nav { display:flex; gap:8px; }
        .nav-dot {
            width:8px;
            height:8px;
            border-radius:50%;
            background:rgba(255,255,255,0.1);
            border:none;
            cursor:pointer;
            transition:0.3s;
        }
        .nav-dot.active { background:var(--neon-purple); box-shadow:0 0 20px rgba(168,85,247,0.3); }

        /* GENRE FILTER */
        .genre-filter {
            display:flex;
            flex-wrap:wrap;
            gap:8px;
            margin:25px 0 10px 0;
            padding:14px 18px;
            background:var(--bg-card);
            backdrop-filter:blur(10px);
            -webkit-backdrop-filter:blur(10px);
            border:var(--border-neon);
            max-height:150px;
            overflow-y:auto;
            justify-content:center;
            /* genre filter container clipped */
            clip-path: polygon(
                10px 0%,
                100% 0%,
                100% 0%,
                100% calc(100% - 10px),
                calc(100% - 10px) 100%,
                0% 100%,
                0% 100%,
                0% 10px
            );
        }
        .genre-filter::-webkit-scrollbar { width:4px; }
        .genre-filter::-webkit-scrollbar-track { background:transparent; }
        .genre-filter::-webkit-scrollbar-thumb { background:var(--neon-purple); border-radius:10px; }

        .genre-btn {
            background:rgba(255,255,255,0.03);
            border:1px solid rgba(255,255,255,0.06);
            color:var(--text-secondary);
            padding:6px 16px;
            cursor:pointer;
            font-size:12px;
            font-weight:500;
            transition:0.3s;
            white-space:nowrap;
            /* genre btn clipped */
            clip-path: polygon(
                6px 0%,
                100% 0%,
                100% 0%,
                100% calc(100% - 6px),
                calc(100% - 6px) 100%,
                0% 100%,
                0% 100%,
                0% 6px
            );
        }
        .genre-btn:hover { background:rgba(168,85,247,0.1); color:var(--text-primary); border-color:var(--neon-purple); }
        .genre-btn.active {
            background:linear-gradient(135deg,var(--neon-purple),var(--neon-pink));
            color:#fff;
            border-color:transparent;
            box-shadow:0 0 30px rgba(168,85,247,0.2);
        }

        /* GRID ANIME */
        .anime-grid {
            display:grid;
            grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
            gap:20px;
            margin-top:10px;
        }
        .anime-card {
            background:var(--bg-card);
            backdrop-filter:blur(10px);
            border:var(--border-neon);
            overflow:hidden;
            cursor:pointer;
            transition:0.3s;
            position:relative;
            /* anime card clipped */
            clip-path: polygon(
                8px 0%,
                100% 0%,
                100% 0%,
                100% calc(100% - 8px),
                calc(100% - 8px) 100%,
                0% 100%,
                0% 100%,
                0% 8px
            );
        }
        .anime-card::before {
            content:'';
            position:absolute;
            top:0;
            left:0;
            right:0;
            bottom:0;
            background:linear-gradient(180deg,transparent 50%,rgba(0,0,0,0.6));
            z-index:1;
            opacity:0;
            transition:0.3s;
        }
        .anime-card:hover { transform:translateY(-8px); border-color:var(--neon-purple); box-shadow:var(--glow-purple); }
        .anime-card:hover::before { opacity:1; }
        .anime-card img { width:100%; height:280px; object-fit:cover; background:var(--bg-secondary); }
        .anime-card .info { padding:12px 14px 14px; position:relative; z-index:2; }
        .anime-card .info h3 {
            font-size:14px;
            font-weight:600;
            color:var(--text-primary);
            white-space:nowrap;
            overflow:hidden;
            text-overflow:ellipsis;
        }
        .anime-card .info p { font-size:12px; color:var(--text-secondary); margin-top:4px; }

        /* PAGINATION */
        .pagination {
            display:flex;
            align-items:center;
            justify-content:center;
            gap:15px;
            margin:30px 0 10px 0;
            padding:16px 0;
            border-top:var(--border-neon);
            flex-wrap:wrap;
        }
        .pagination button {
            background:var(--bg-card);
            backdrop-filter:blur(10px);
            border:var(--border-neon);
            color:var(--text-primary);
            padding:8px 20px;
            cursor:pointer;
            font-size:13px;
            transition:0.3s;
            display:flex;
            align-items:center;
            gap:8px;
            /* pagination button clipped */
            clip-path: polygon(
                8px 0%,
                100% 0%,
                100% 0%,
                100% calc(100% - 8px),
                calc(100% - 8px) 100%,
                0% 100%,
                0% 100%,
                0% 8px
            );
        }
        .pagination button:hover:not(:disabled) {
            background:linear-gradient(135deg,var(--neon-purple),var(--neon-pink));
            border-color:transparent;
            box-shadow:0 0 30px rgba(168,85,247,0.2);
        }
        .pagination button:disabled { opacity:0.3; cursor:not-allowed; }
        .pagination #pageInfo { font-size:13px; color:var(--text-secondary); min-width:100px; text-align:center; }

        /* LOADING */
        .loader { display:flex; justify-content:center; padding:60px 0; }
        .loader i {
            font-size:40px;
            color:var(--neon-purple);
            animation:spin 1s linear infinite;
            text-shadow:0 0 40px rgba(168,85,247,0.3);
        }
        @keyframes spin { 0% { transform:rotate(0deg); } 100% { transform:rotate(360deg); } }
        .empty-state { text-align:center; padding:50px 0; color:var(--text-secondary); }
        .empty-state i { font-size:40px; margin-bottom:10px; color:rgba(255,255,255,0.05); }

        /* FOOTER */
        footer { margin-top:40px; border-top:var(--border-neon); padding:30px 30px 20px; }
        .footer-content {
            max-width:1400px;
            margin:0 auto;
            display:flex;
            justify-content:space-between;
            align-items:center;
            flex-wrap:wrap;
            gap:20px;
        }
        .footer-logo {
            font-family:'Orbitron',sans-serif;
            font-size:18px;
            font-weight:900;
            color:var(--text-primary);
            display:flex;
            align-items:center;
            gap:8px;
        }
        .footer-logo .neon { color:var(--neon-purple); text-shadow:0 0 20px rgba(168,85,247,0.3); }
        .footer-links { display:flex; gap:20px; }
        .footer-links a { color:var(--text-secondary); text-decoration:none; font-size:13px; transition:0.3s; }
        .footer-links a:hover { color:var(--neon-purple); }
        .footer-social { display:flex; gap:16px; }
        .footer-social a { color:var(--text-secondary); font-size:18px; transition:0.3s; }
        .footer-social a:hover { color:var(--neon-purple); }
        .footer-bottom {
            max-width:1400px;
            margin:20px auto 0;
            padding-top:16px;
            border-top:1px solid rgba(255,255,255,0.03);
            text-align:center;
            font-size:12px;
            color:var(--text-secondary);
        }
        .footer-bottom .neon { color:var(--neon-pink); }

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (max-width:900px) {
            .hero-title { font-size:36px; }
            .hero-banner { padding:40px 20px 30px; margin:10px 15px; }
            .footer-content { flex-direction:column; text-align:center; }
        }
        @media (max-width:768px) {
            header { padding:10px 15px; }
            .header-top { flex-direction:column; align-items:stretch; g
