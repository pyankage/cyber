<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tonton Anime</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0a0a0f; color: #f1f3f5; min-height: 100vh; }
        .container { max-width: 1000px; margin: 0 auto; padding: 20px; }
        .video-wrapper { background: #000; border-radius: 16px; overflow: hidden; aspect-ratio: 16/9; width: 100%; border: 1px solid rgba(168,85,247,0.2); }
        .video-wrapper iframe { width: 100%; height: 100%; border: none; }
        .episode-info { margin-top: 18px; text-align: center; padding: 18px; background: rgba(18,18,31,0.6); border-radius: 16px; border: 1px solid rgba(168,85,247,0.2); }
        .episode-info h2 { font-size: 20px; color: #f1f3f5; }
        .back-btn { background: transparent; border: 1px solid rgba(168,85,247,0.2); color: #f1f3f5; padding: 10px 20px; border-radius: 30px; cursor: pointer; margin-bottom: 15px; transition: 0.3s; }
        .back-btn:hover { background: rgba(168,85,247,0.2); }
        .watch-nav { display: flex; align-items: center; justify-content: center; gap: 20px; margin-top: 18px; }
        .watch-nav button { background: rgba(18,18,31,0.6); border: 1px solid rgba(168,85,247,0.2); color: #f1f3f5; width: 44px; height: 44px; border-radius: 50%; cursor: pointer; font-size: 18px; transition: 0.3s; display: flex; align-items: center; justify-content: center; }
        .watch-nav button:hover:not(:disabled) { background: linear-gradient(135deg, #a855f7, #ec4899); border-color: transparent; }
        .watch-nav button:disabled { opacity: 0.3; cursor: not-allowed; }
        .watch-nav #episodeCounter { font-size: 14px; color: #8892b0; min-width: 60px; text-align: center; }
        @media (max-width: 768px) { .container { padding: 12px; } .watch-nav button { width: 40px; height: 40px; font-size: 16px; } }
    </style>
</head>
<body>
    <div class="container">
        <button class="back-btn" onclick="goBack()"><i class="fas fa-arrow-left"></i> Kembali</button>
        
        <div class="video-wrapper">
            <iframe id="videoPlayer" src="" frameborder="0" allow="autoplay; encrypted-media; fullscreen" allowfullscreen sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-presentation"></iframe>
        </div>

        <div class="episode-info">
            <h2 id="watchTitle">Memuat...</h2>
        </div>

        <div class="watch-nav">
            <button id="prevBtn" onclick="navigateEpisode(-1)"><i class="fas fa-chevron-left"></i></button>
            <span id="episodeCounter">1 / 1</span>
            <button id="nextBtn" onclick="navigateEpisode(1)"><i class="fas fa-chevron-right"></i></button>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const animeFolder = urlParams.get('anime') || '';
        const episodeParam = urlParams.get('ep');
        const videoUrl = urlParams.get('url');

        // Data dari localStorage
        let episodeList = [];
        let animeTitle = '';

        try {
            const episodesData = localStorage.getItem('currentEpisodes');
            if (episodesData) episodeList = JSON.parse(episodesData);
            const animeData = localStorage.getItem('currentAnime');
            if (animeData) {
                const anime = JSON.parse(animeData);
                animeTitle = anime.title || 'Series';
            }
        } catch(e) {}

        let currentIndex = 0;

        function loadEpisode(index) {
            const iframe = document.getElementById('videoPlayer');
            const titleEl = document.getElementById('watchTitle');
            
            // Kalau ada videoUrl dari URL, langsung pakai
            if (videoUrl) {
                iframe.src = videoUrl;
                titleEl.innerHTML = `${animeTitle || 'Series'} Episode <span style="color:#a855f7;">${episodeParam || '?'}</span>`;
                document.getElementById('episodeCounter').textContent = '1 / 1';
                document.getElementById('prevBtn').disabled = true;
                document.getElementById('nextBtn').disabled = true;
                return;
            }

            // Kalau dari localStorage
            if (!episodeList || episodeList.length === 0) {
                titleEl.textContent = '⚠️ Tidak ada episode';
                return;
            }
            if (index < 0 || index >= episodeList.length) return;
            
            const ep = episodeList[index];
            currentIndex = index;
            iframe.src = ep.url;
            titleEl.innerHTML = `${animeTitle || 'Series'} Episode <span style="color:#a855f7;">${ep.number}</span>`;
            document.getElementById('episodeCounter').textContent = `${index + 1} / ${episodeList.length}`;
            document.getElementById('prevBtn').disabled = (index <= 0);
            document.getElementById('nextBtn').disabled = (index >= episodeList.length - 1);
        }

        function navigateEpisode(direction) {
            if (!episodeList || episodeList.length === 0) return;
            const newIndex = currentIndex + direction;
            if (newIndex < 0 || newIndex >= episodeList.length) return;
            loadEpisode(newIndex);
        }

        function goBack() {
            if (animeFolder) {
                location.href = `${animeFolder}/info.html`;
            } else {
                location.href = 'index.html';
            }
        }

        // Inisialisasi
        if (videoUrl) {
            loadEpisode(0);
        } else if (episodeParam && episodeList.length > 0) {
            const idx = episodeList.findIndex(e => parseInt(e.number) == parseInt(episodeParam));
            loadEpisode(idx >= 0 ? idx : 0);
        } else if (episodeList.length > 0) {
            loadEpisode(0);
        } else {
            document.getElementById('watchTitle').textContent = '⚠️ Belum ada episode';
        }
    </script>
</body>
</html>
