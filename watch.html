<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnimeStream - Tonton</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;500;600;700&display=swap');

        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121f;
            --bg-card: rgba(18, 18, 31, 0.6);
            --neon-purple: #a855f7;
            --neon-pink: #ec4899;
            --text-primary: #f1f3f5;
            --text-secondary: #8892b0;
            --glow-purple: 0 0 30px rgba(168, 85, 247, 0.15);
            --border-neon: 1px solid rgba(168, 85, 247, 0.2);
        }

        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
        }

        header {
            background: rgba(10, 10, 15, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: var(--border-neon);
            padding: 12px 30px;
            position: sticky;
            top: 0;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        .logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 20px;
            font-weight: 900;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .logo .neon { color: var(--neon-purple); text-shadow: 0 0 20px rgba(168, 85, 247, 0.4); }
        .cyber-badge {
            font-family: 'Orbitron', sans-serif;
            font-size: 8px;
            font-weight: 700;
            color: var(--neon-pink);
            background: rgba(236, 72, 153, 0.15);
            border: 1px solid rgba(236, 72, 153, 0.3);
            padding: 2px 8px;
            border-radius: 4px;
            letter-spacing: 1px;
        }
        .nav-links {
            display: flex;
            gap: 20px;
            align-items: center;
        }
        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            transition: 0.3s;
        }
        .nav-links a:hover { color: var(--neon-purple); }

        .breadcrumb {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 15px 0 10px 0;
            font-size: 13px;
            color: var(--text-secondary);
        }
        .breadcrumb a {
            color: var(--text-secondary);
            text-decoration: none;
            cursor: pointer;
            transition: 0.3s;
        }
        .breadcrumb a:hover { color: var(--neon-purple); }
        .breadcrumb i { font-size: 10px; color: rgba(255,255,255,0.1); }
        .breadcrumb span { color: var(--text-primary); font-weight: 600; }

        .container { max-width: 1100px; margin: 0 auto; padding: 20px; }

        .video-wrapper {
            background: #000;
            overflow: hidden;
            aspect-ratio: 16/9;
            width: 100%;
            border: var(--border-neon);
            position: relative;
            /* CLIPPED CORNER: kiri atas + kanan bawah */
            clip-path: polygon(
                12px 0%,
                100% 0%,
                100% 0%,
                100% calc(100% - 12px),
                calc(100% - 12px) 100%,
                0% 100%,
                0% 100%,
                0% 12px
            );
        }
        .video-wrapper iframe { width: 100%; height: 100%; border: none; }

        .episode-info {
            margin-top: 18px;
            text-align: center;
            padding: 20px;
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            border: var(--border-neon);
            /* CLIPPED CORNER: kiri atas + kanan bawah */
            clip-path: polygon(
                12px 0%,
                100% 0%,
                100% 0%,
                100% calc(100% - 12px),
                calc(100% - 12px) 100%,
                0% 100%,
                0% 100%,
                0% 12px
            );
        }
        .episode-info h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
        }
        .episode-info h2 .neon { color: var(--neon-purple); }

        .watch-nav {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-top: 18px;
        }
        .watch-nav button {
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            border: var(--border-neon);
            color: var(--text-primary);
            width: 44px;
            height: 44px;
            cursor: pointer;
            font-size: 18px;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            /* CLIPPED CORNER: kiri atas + kanan bawah */
            clip-path: polygon(
                8px 0%,
                100% 0%,
                100% 0%,
                100% calc(100% - 8px),
                calc(100% - 8px) 100%,
                0% 100%,
                0% 100%,
                0% 8px
            );
        }
        .watch-nav button:hover:not(:disabled) {
            background: linear-gradient(135deg, var(--neon-purple), var(--neon-pink));
            border-color: transparent;
            box-shadow: 0 0 30px rgba(168, 85, 247, 0.3);
        }
        .watch-nav button:disabled { opacity: 0.3; cursor: not-allowed; }
        .watch-nav #episodeCounter {
            font-size: 14px;
            color: var(--text-secondary);
            min-width: 60px;
            text-align: center;
        }

        .footer {
            margin-top: 40px;
            padding-top: 18px;
            border-top: var(--border-neon);
            text-align: center;
            font-size: 13px;
            color: var(--text-secondary);
        }
        .footer .neon { color: var(--neon-pink); }

        @media (max-width: 768px) {
            header { padding: 10px 15px; flex-direction: column; align-items: stretch; gap: 10px; }
            .nav-links { justify-content: center; flex-wrap: wrap; gap: 12px; }
            .container { padding: 12px; }
            .episode-info h2 { font-size: 17px; }
            .watch-nav button { width: 40px; height: 40px; font-size: 16px; }
        }
        @media (max-width: 480px) {
            .watch-nav { gap: 12px; }
            .watch-nav button { width: 36px; height: 36px; font-size: 14px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <span class="neon">A</span>nime<span class="neon">S</span>tream
            <span class="cyber-badge">✦ WATCH</span>
        </div>
        <div class="nav-links">
            <a href="index.html"><i class="fas fa-home"></i> Home</a>
            <a href="#"><i class="fas fa-fire"></i> Trending</a>
            <a href="#"><i class="fas fa-tags"></i> Genre</a>
        </div>
    </header>

    <div class="container">

        <div class="breadcrumb">
            <a href="#" onclick="goHome()">Home</a>
            <i class="fas fa-chevron-right"></i>
            <a href="#" id="breadcrumbSeriesLink" onclick="goToDetail()">Series</a>
            <i class="fas fa-chevron-right"></i>
            <span id="breadcrumbEpisode">Episode</span>
        </div>

        <div class="video-wrapper">
            <iframe id="videoPlayer" src="" frameborder="0" allow="autoplay; encrypted-media; fullscreen" allowfullscreen sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-presentation"></iframe>
        </div>

        <div class="episode-info">
            <h2 id="watchTitle">Memuat...</h2>
        </div>

        <div class="watch-nav">
            <button id="prevBtn" onclick="navigateEpisode(-1)"><i class="fas fa-chevron-left"></i></button>
            <span id="episodeCounter">1 / 1</span>
            <button id="nextBtn" onclick="navigateEpisode(1)"><i class="fas fa-chevron-right"></i></button>
        </div>

        <div class="footer">
            &copy; 2026 AnimeStream — Made with <i class="fas fa-heart neon"></i>
        </div>

    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const animeFolder = urlParams.get('anime') || '';
        const episodeParam = urlParams.get('ep');
        const videoUrlParam = urlParams.get('url');

        // ============================================================
        //  ★ BACA EPISODE DARI LOCALSTORAGE (SPREADSHEET) ★
        // ============================================================
        let episodeList = [];
        let currentAnimeTitle = '';

        try {
            const episodesData = localStorage.getItem('currentEpisodes');
            if (episodesData) {
                episodeList = JSON.parse(episodesData);
                console.log('📦 Episodes from localStorage:', episodeList.length);
            }
            
            const animeData = localStorage.getItem('currentAnime');
            if (animeData) {
                const anime = JSON.parse(animeData);
                currentAnimeTitle = anime.title || 'Series';
                console.log('📦 Anime title:', currentAnimeTitle);
            }
        } catch (e) {
            console.error('Error parsing localStorage:', e);
        }

        // ============================================================
        //  ★ FALLBACK: EPISODE 7 - TSUIHOU SARETA ★
        //  ★ DIGUNAKAN JIKA LOCALSTORAGE KOSONG ★
        // ============================================================
        if (episodeList.length === 0) {
            episodeList = [
                { number: 7, title: 'Tsuihou Sareta', url: 'https://ok.ru/videoembed/9912202562114' }
            ];
            console.log('📦 Using fallback episode (Tsuihou Sareta)');
        }
        // ============================================================
        //  ★ AKHIR FALLBACK ★
        // ============================================================

        let currentIndex = 0;

        function findEpisodeIndex(epNumber) {
            for (let i = 0; i < episodeList.length; i++) {
                if (parseInt(episodeList[i].number) == parseInt(epNumber)) return i;
            }
            return 0;
        }

        // ============================================================
        //  ★ DETEKSI PLATFORM VIDEO (OTOMATIS) ★
        // ============================================================
        function getEmbedUrl(url) {
            if (!url) return url;
            
            // OK.ru - ubah ke format embed
            if (url.includes('ok.ru/video/')) {
                return url.replace('ok.ru/video/', 'ok.ru/videoembed/');
            }
            
            // Dailymotion - ubah ke format embed
            if (url.includes('dailymotion.com/video/')) {
                return url.replace('dailymotion.com/video/', 'dailymotion.com/embed/video/');
            }
            
            // YouTube - ubah ke format embed
            if (url.includes('youtube.com/watch?v=')) {
                const videoId = url.split('v=')[1]?.split('&')[0];
                if (videoId) return `https://www.youtube.com/embed/${videoId}`;
            }
            if (url.includes('youtu.be/')) {
                const videoId = url.split('youtu.be/')[1]?.split('?')[0];
                if (videoId) return `https://www.youtube.com/embed/${videoId}`;
            }
            
            // Mega.nz - ubah ke format embed
            if (url.includes('mega.nz/file/')) {
                return url.replace('mega.nz/file/', 'mega.nz/embed/');
            }
            
            // Google Drive
            if (url.includes('drive.google.com/file/d/')) {
                if (!url.endsWith('/preview')) {
                    return url + '/preview';
                }
            }
            
            // YourUpload
            if (url.includes('yourupload.com/')) {
                if (!url.includes('/embed/')) {
                    const parts = url.split('/');
                    const id = parts[parts.length - 1];
                    if (id) return `https://www.yourupload.com/embed/${id}`;
                }
            }
            
            return url;
        }

        function loadEpisode(index) {
            // Kalau ada videoUrl dari URL, langsung pakai (prioritas utama)
            if (videoUrlParam) {
                const embedUrl = getEmbedUrl(videoUrlParam);
                document.getElementById('videoPlayer').src = embedUrl;
                document.getElementById('watchTitle').innerHTML = `${currentAnimeTitle || 'Series'} Episode <span class="neon">${episodeParam || '?'}</span>`;
                document.getElementById('episodeCounter').textContent = '1 / 1';
                document.getElementById('prevBtn').disabled = true;
                document.getElementById('nextBtn').disabled = true;
                
                // Update breadcrumb
                const seriesName = document.getElementById('breadcrumbSeriesLink');
                if (seriesName) {
                    seriesName.textContent = currentAnimeTitle || 'Series';
                }
                document.getElementById('breadcrumbEpisode').textContent = `Episode ${episodeParam || '?'}`;
                return;
            }

            // Kalau tidak ada videoUrl, pakai dari episodeList
            if (!episodeList || episodeList.length === 0) {
                document.getElementById('watchTitle').textContent = '⚠️ Belum ada episode';
                return;
            }

            if (index < 0 || index >= episodeList.length) return;
            const ep = episodeList[index];
            currentIndex = index;

            // ★ OTOMATIS FIX LINK ★
            const embedUrl = getEmbedUrl(ep.url);
            document.getElementById('videoPlayer').src = embedUrl;
            
            document.getElementById('watchTitle').innerHTML = `${currentAnimeTitle || 'Series'} Episode <span class="neon">${ep.number}</span>`;
            document.getElementById('episodeCounter').textContent = `${index + 1} / ${episodeList.length}`;
            document.getElementById('prevBtn').disabled = (index <= 0);
            document.getElementById('nextBtn').disabled = (index >= episodeList.length - 1);

            // Update breadcrumb
            const seriesName = document.getElementById('breadcrumbSeriesLink');
            if (seriesName) {
                seriesName.textContent = currentAnimeTitle || 'Series';
            }
            document.getElementById('breadcrumbEpisode').textContent = `Episode ${ep.number}`;

            const newUrl = `?anime=${animeFolder}&ep=${ep.number}&url=${encodeURIComponent(ep.url)}`;
            window.history.pushState({ path: newUrl }, '', newUrl);
        }

        function navigateEpisode(direction) {
            if (!episodeList || episodeList.length === 0) return;
            const newIndex = currentIndex + direction;
            if (newIndex < 0 || newIndex >= episodeList.length) return;
            loadEpisode(newIndex);
        }

        function goHome() {
            location.href = 'index.html';
        }

        function goToDetail() {
            if (animeFolder) {
                location.href = `${animeFolder}/info.html`;
            } else {
                location.href = 'index.html';
            }
        }

        // ★ INISIALISASI ★
        if (videoUrlParam) {
            // Prioritas: pakai video dari URL
            loadEpisode(0);
        } else if (episodeParam && episodeList.length > 0) {
            const idx = findEpisodeIndex(parseInt(episodeParam));
            loadEpisode(idx >= 0 ? idx : 0);
        } else if (episodeList.length > 0) {
            loadEpisode(0);
        } else {
            document.getElementById('watchTitle').textContent = '⚠️ Belum ada episode';
        }

        window.addEventListener('popstate', function() {
            const params = new URLSearchParams(window.location.search);
            const ep = params.get('ep');
            const url = params.get('url');
            if (url) {
                // Jika ada url di parameter, langsung pakai
                const embedUrl = getEmbedUrl(url);
                document.getElementById('videoPlayer').src = embedUrl;
                document.getElementById('watchTitle').innerHTML = `${currentAnimeTitle || 'Series'} Episode <span class="neon">${ep || '?'}</span>`;
                return;
            }
            if (ep && episodeList.length > 0) {
                const idx = findEpisodeIndex(parseInt(ep));
                loadEpisode(idx);
            }
        });

        console.log('🚀 Watch page ready!');
        console.log('📺 Episodes:', episodeList.length);
        console.log('📌 Anime:', currentAnimeTitle);
    </script>

</body>
</html>
